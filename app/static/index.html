<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio Bot</title>
  <style>
    /* ── Reset & Variables ─────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0f1117;
      --surface:   #1a1d27;
      --border:    #2a2d3a;
      --text:      #e4e4e7;
      --text-dim:  #9ca3af;
      --accent:    #6366f1;
      --accent-hover: #818cf8;
      --user-bg:   #2d2f6e;
      --bot-bg:    #1e2030;
      --danger:    #ef4444;
      --radius:    12px;
    }

    html, body {
      height: 100%;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    /* ── Layout ────────────────────────────────────────────── */
    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-width: 820px;
      margin: 0 auto;
    }

    /* ── Header ────────────────────────────────────────────── */
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }

    .header .avatar {
      width: 40px; height: 40px;
      border-radius: 50%;
      background: var(--accent);
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }

    .header h1 { font-size: 18px; font-weight: 600; }
    .header p  { font-size: 12px; color: var(--text-dim); margin-top: 2px; }

    /* ── Chat area ─────────────────────────────────────────── */
    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      scroll-behavior: smooth;
    }

    .chat::-webkit-scrollbar        { width: 6px; }
    .chat::-webkit-scrollbar-thumb  { background: var(--border); border-radius: 3px; }
    .chat::-webkit-scrollbar-track  { background: transparent; }

    /* ── Message bubbles ───────────────────────────────────── */
    .msg { display: flex; gap: 12px; max-width: 85%; animation: fadeIn .25s ease; }
    .msg.user   { align-self: flex-end; flex-direction: row-reverse; }
    .msg.bot    { align-self: flex-start; }

    .msg .icon {
      width: 32px; height: 32px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px; flex-shrink: 0;
    }
    .msg.user .icon { background: var(--user-bg); }
    .msg.bot  .icon { background: var(--accent);  }

    .msg .bubble {
      padding: 12px 16px;
      border-radius: var(--radius);
      line-height: 1.6;
      font-size: 14px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.user .bubble { background: var(--user-bg); border-bottom-right-radius: 4px; }
    .msg.bot  .bubble { background: var(--bot-bg);  border-bottom-left-radius: 4px;  }

    .msg .bubble.streaming::after {
      content: '▋';
      animation: blink .8s steps(2) infinite;
      color: var(--accent);
    }

    /* ── Welcome message ───────────────────────────────────── */
    .welcome {
      text-align: center;
      margin: auto;
      padding: 40px 24px;
      max-width: 460px;
    }
    .welcome .emoji { font-size: 48px; margin-bottom: 16px; }
    .welcome h2     { font-size: 20px; margin-bottom: 8px; }
    .welcome p      { color: var(--text-dim); font-size: 14px; line-height: 1.5; }

    .suggestions {
      display: flex; flex-wrap: wrap; gap: 8px;
      justify-content: center;
      margin-top: 20px;
    }
    .suggestions button {
      padding: 8px 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      color: var(--text);
      font-size: 13px;
      cursor: pointer;
      transition: border-color .2s, background .2s;
    }
    .suggestions button:hover {
      border-color: var(--accent);
      background: var(--bot-bg);
    }

    /* ── Input bar ─────────────────────────────────────────── */
    .input-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 16px 24px;
      border-top: 1px solid var(--border);
      background: var(--surface);
    }

    .input-bar textarea {
      flex: 1;
      resize: none;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg);
      color: var(--text);
      padding: 12px 16px;
      font-size: 14px;
      font-family: inherit;
      line-height: 1.4;
      max-height: 120px;
      outline: none;
      transition: border-color .2s;
    }
    .input-bar textarea:focus { border-color: var(--accent); }
    .input-bar textarea::placeholder { color: var(--text-dim); }

    .input-bar button {
      width: 44px; height: 44px;
      border: none;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background .2s, transform .1s;
      flex-shrink: 0;
    }
    .input-bar button:hover:not(:disabled)  { background: var(--accent-hover); }
    .input-bar button:active:not(:disabled) { transform: scale(.93); }
    .input-bar button:disabled { opacity: .45; cursor: not-allowed; }

    .input-bar button svg { width: 20px; height: 20px; }

    /* ── Animations ────────────────────────────────────────── */
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes blink  { 50% { opacity: 0; } }

    /* ── Responsive ────────────────────────────────────────── */
    @media (max-width: 600px) {
      .msg { max-width: 95%; }
      .input-bar { padding: 12px 16px; }
      .chat { padding: 16px; }
    }
  </style>
</head>

<body>
  <div class="app">
    <!-- Header -->
    <div class="header">
      <div class="avatar">🤖</div>
      <div>
        <h1>Portfolio Bot</h1>
        <p>Ask me anything about this person's background</p>
      </div>
    </div>

    <!-- Chat area -->
    <div class="chat" id="chat">
      <div class="welcome" id="welcome">
        <div class="emoji">💬</div>
        <h2>Hey there!</h2>
        <p>
          I'm a portfolio assistant. Ask me about this person's skills,
          experience, projects, education — anything from their portfolio.
        </p>
        <div class="suggestions" id="suggestions">
          <button>What are their skills?</button>
          <button>Tell me about their experience</button>
          <button>What projects have they built?</button>
          <button>What's their education?</button>
        </div>
      </div>
    </div>

    <!-- Input bar -->
    <div class="input-bar">
      <textarea
        id="input"
        rows="1"
        placeholder="Ask a question…"
        autocomplete="off"
      ></textarea>
      <button id="send" title="Send">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"/>
          <polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </div>
  </div>

<script>
// ── DOM refs ──────────────────────────────────────────────────
const chatEl    = document.getElementById('chat');
const inputEl   = document.getElementById('input');
const sendBtn   = document.getElementById('send');
const welcomeEl = document.getElementById('welcome');

let isStreaming = false;

// ── Suggestion buttons ────────────────────────────────────────
document.getElementById('suggestions').addEventListener('click', (e) => {
  if (e.target.tagName === 'BUTTON') {
    inputEl.value = e.target.textContent;
    send();
  }
});

// ── Auto-resize textarea ──────────────────────────────────────
inputEl.addEventListener('input', () => {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
});

// ── Key bindings ──────────────────────────────────────────────
inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});

sendBtn.addEventListener('click', send);

// ── Helpers ───────────────────────────────────────────────────
function scrollBottom() {
  chatEl.scrollTop = chatEl.scrollHeight;
}

function addMessage(role, text) {
  const icon = role === 'user' ? '👤' : '🤖';
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  div.innerHTML = `
    <div class="icon">${icon}</div>
    <div class="bubble">${escapeHtml(text)}</div>
  `;
  chatEl.appendChild(div);
  scrollBottom();
  return div.querySelector('.bubble');
}

function escapeHtml(t) {
  const d = document.createElement('div');
  d.textContent = t;
  return d.innerHTML;
}

// ── Main send function ────────────────────────────────────────
async function send() {
  const question = inputEl.value.trim();
  if (!question || isStreaming) return;

  // Hide welcome
  if (welcomeEl) welcomeEl.remove();

  // Show user bubble
  addMessage('user', question);
  inputEl.value = '';
  inputEl.style.height = 'auto';

  // Show empty bot bubble
  const bubble = addMessage('bot', '');
  bubble.classList.add('streaming');

  isStreaming = true;
  sendBtn.disabled = true;

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question }),
    });

    if (!res.ok) {
      bubble.textContent = 'Something went wrong. Please try again.';
      bubble.classList.remove('streaming');
      return;
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    let fullText = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop();              // keep incomplete line

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const payload = line.slice(6).trim();

        if (payload === '[DONE]') continue;

        try {
          const obj = JSON.parse(payload);
          if (obj.error) {
            fullText = obj.error;
            bubble.textContent = fullText;
            break;
          }
          if (obj.token) {
            fullText += obj.token;
            bubble.textContent = fullText;
            scrollBottom();
          }
        } catch { /* ignore malformed lines */ }
      }
    }

    bubble.classList.remove('streaming');

    if (!fullText) {
      bubble.textContent = 'No response received.';
    }

  } catch (err) {
    bubble.classList.remove('streaming');
    bubble.textContent = 'Network error — is the server running?';
    console.error(err);
  } finally {
    isStreaming = false;
    sendBtn.disabled = false;
    inputEl.focus();
  }
}
</script>
</body>
</html>
