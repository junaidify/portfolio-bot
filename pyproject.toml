[project]
name = "portfolio-bot"
version = "1.0.0"
description = "RAG-powered portfolio assistant with pgvector + Groq streaming"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "python-dotenv",
    "pgvector",
    "psycopg2-binary",
    "numpy",
    "pypdf",
    "python-docx",
    "openai",
    "groq",
    "watchdog",
    "tenacity",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
